<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fresh Page Not Found &mdash; Stackly</title>
  
  <!-- Font Awesome Icons CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/style.css?v=37">
  <link rel="stylesheet" href="css/404.css?v=37">
</head>
<body class="error-page-body">

  <!-- Organic Background Blobs -->
  <div class="organic-blob blob-1"></div>
  <div class="organic-blob blob-2"></div>

  <!-- Floating Leaf Particles -->
  <i class="fa-solid fa-leaf floating-leaf" style="top: 15%; left: 10%; font-size: 2.4rem;"></i>
  <i class="fa-solid fa-seedling floating-leaf" style="bottom: 20%; left: 15%; font-size: 1.8rem; animation-delay: 2s;"></i>
  <i class="fa-solid fa-leaf floating-leaf" style="top: 20%; right: 12%; font-size: 2.8rem; animation-delay: 4s;"></i>
  <i class="fa-solid fa-seedling floating-leaf" style="bottom: 15%; right: 10%; font-size: 2.2rem; animation-delay: 1.5s;"></i>

  <!-- Main Error Card -->
  <div class="error-container">
    
    <!-- Error Code Graphic -->
    <div class="error-graphic">
      <div class="error-code font-serif">
        4<span>0</span>4
      </div>
    </div>

    <h1 class="error-title font-serif">Fresh Page Not Found</h1>
    
    <p class="error-desc">
      Looks like this page wandered away from the farm. The link you followed may be non-functional, expired, or cultivating elsewhere.
    </p>

    <!-- Action Buttons -->
    <div class="error-actions">
      <button class="btn btn-outline btn-lg" onclick="window.history.back()">
        <i class="fa-solid fa-arrow-left"></i> Go Back
      </button>
      <a href="index.html" class="btn btn-primary btn-lg">
        <i class="fa-solid fa-house"></i> Back to Home
      </a>
    </div>

  </div>

  <!-- Central JavaScript -->
  <script src="js/main.js?v=37"></script>
</body>
</html>
