<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      background: linear-gradient(135deg, #f0f5ee 0%, #e0ece4 100%);
      margin: 0;
      font-family: 'Inter', sans-serif;
      overflow: hidden;
    }
    .error-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
      position: relative;
    }
    .error-card {
      background: #ffffff;
      padding: 4rem 3rem;
      border-radius: 30px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.08);
      max-width: 600px;
      width: 100%;
      position: relative;
      z-index: 2;
      animation: fadeInUp 0.8s ease;
    }
    .error-card h1 { 
      font-size: 10rem; 
      color: var(--primary-green); 
      margin-bottom: 0; 
      line-height: 1; 
      text-shadow: 4px 4px 0px rgba(104, 159, 56, 0.2);
    }
    .error-card h2 { 
      font-size: 2.2rem; 
      color: var(--dark-text); 
      margin: 1rem 0; 
      font-weight: 800;
    }
    .error-card p { 
      font-size: 1.1rem; 
      color: var(--text-gray); 
      margin-bottom: 2.5rem; 
      line-height: 1.6;
    }
    .btn-group {
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
    }
    .btn-secondary {
      background: #fff;
      color: var(--dark-text);
      border: 2px solid var(--border-color);
      padding: 0.8rem 1.8rem;
      border-radius: 50px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      text-decoration: none;
      transition: all 0.3s;
    }
    .btn-secondary:hover {
      background: var(--bg-light);
      border-color: #ccc;
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    /* Background decorations */
    .shape-1, .shape-2 {
      position: absolute;
      border-radius: 50%;
      z-index: 1;
      opacity: 0.5;
    }
    .shape-1 {
      width: 400px;
      height: 400px;
      background: rgba(104, 159, 56, 0.1);
      top: -100px;
      left: -100px;
      filter: blur(40px);
    }
    .shape-2 {
      width: 300px;
      height: 300px;
      background: rgba(52, 152, 219, 0.1);
      bottom: -50px;
      right: -50px;
      filter: blur(40px);
    }
  </style>
</head>
<body>
  <div class="error-page">
    <div class="shape-1"></div>
    <div class="shape-2"></div>
    
    <div class="error-card">
      <i class="fa-solid fa-basket-shopping" style="font-size: 4rem; color: var(--primary-green); opacity: 0.2; position: absolute; top: 2rem; right: 2rem;"></i>
      <h1>404</h1>
      <h2>Oops! Page Not Found</h2>
      <p>It looks like this aisle is empty! The page or profile you are looking for doesn't exist, has been moved, or is temporarily unavailable.</p>
      
      <div class="btn-group">
        <button onclick="window.history.back()" class="btn-secondary"><i class="fa-solid fa-arrow-left"></i> Go Back</button>
        <a href="index.html" class="btn btn-primary"><i class="fa-solid fa-house"></i> Back to Home</a>
      </div>
    </div>
  </div>
</body>
</html>
