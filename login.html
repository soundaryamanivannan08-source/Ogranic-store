<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - PureOrganic</title>
  <link rel="stylesheet" href="auth.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <div class="auth-container">
    
    <!-- Left Banner -->
    <div class="auth-banner">
      <div class="auth-banner-content">
        <h1>Welcome Back to PureOrganic.</h1>
        <p>Login to access your 100% ORGANIC FOOD, manage your orders, and explore daily personalized deals.</p>
      </div>
    </div>

    <!-- Right Form Area -->
    <div class="auth-form-wrapper">
      <div class="auth-form-container">
        <a href="index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i> Back to Home</a>
        <a href="index.html" class="auth-logo"><img src="Assest/images/logo_04.webp" alt="PureOrganic Logo"></a>
        <div class="auth-header">
          <h2>Login to Your Account</h2>
          <p>Please enter your details to sign in</p>
        </div>

        <form id="loginForm">
          <!-- Role Selector -->
          <div class="role-selector">
            <label class="role-label">
              <input type="radio" name="role" value="user" checked required>
              <span class="role-btn">User</span>
            </label>
            <label class="role-label">
              <input type="radio" name="role" value="admin" required>
              <span class="role-btn">Admin</span>
            </label>
          </div>

          <!-- Email -->
          <div class="input-group">
            <input type="email" placeholder="Email Address" required>
            <i class="fa-regular fa-envelope input-icon"></i>
          </div>

          <!-- Password -->
          <div class="input-group">
            <input type="password" id="password" placeholder="Password" required>
            <i class="fa-solid fa-lock input-icon"></i>
            <i class="fa-regular fa-eye eye-toggle" onclick="togglePassword('password', this)"></i>
          </div>

          <!-- Extras -->
          <div class="auth-extras">
            <label class="checkbox-group">
              <input type="checkbox">
              <span>Remember Me</span>
            </label>
            <a href="#" class="forgot-link">Forgot Password?</a>
          </div>

          <!-- Submit -->
          <button type="submit" class="btn-submit">Login</button>

          <!-- Footer -->
          <div class="auth-footer">
            Don't have an account? <a href="signup.html">Sign Up</a>
          </div>
        </form>
      </div>
    </div>

  </div>

  <script>
    function togglePassword(inputId, icon) {
      const input = document.getElementById(inputId);
      if (input.type === 'password') {
        input.type = 'text';
        icon.classList.remove('fa-eye');
        icon.classList.add('fa-eye-slash');
      } else {
        input.type = 'password';
        icon.classList.remove('fa-eye-slash');
        icon.classList.add('fa-eye');
      }
    }

    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const role = document.querySelector('input[name="role"]:checked').value;
      const email = document.querySelector('input[type="email"]').value;
      
      // Save to localStorage
      localStorage.setItem('PureOrganic_role', role);
      localStorage.setItem('PureOrganic_email', email);
      
      if (role === 'admin') {
        window.location.href = 'admin_dashboard.html';
      } else {
        window.location.href = 'user_dashboard.html';
      }
    });
  </script>
</body>
</html>
