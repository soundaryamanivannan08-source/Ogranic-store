<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login  Stackly Organic Food</title>
  
  <!-- Font Awesome Icons CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/style.css?v=37">
  <link rel="stylesheet" href="css/Login.css?v=37">
</head>
<body class="auth-page-body">

  <!-- Floating Leaf Accents -->
  <i class="fa-solid fa-leaf floating-leaf" style="top: 10%; left: 8%; font-size: 2.2rem;"></i>
  <i class="fa-solid fa-seedling floating-leaf" style="bottom: 12%; left: 10%; font-size: 1.8rem; animation-delay: 2s;"></i>
  <i class="fa-solid fa-leaf floating-leaf" style="top: 15%; right: 10%; font-size: 2.5rem; animation-delay: 4s;"></i>
  <i class="fa-solid fa-seedling floating-leaf" style="bottom: 18%; right: 12%; font-size: 2rem; animation-delay: 1.5s;"></i>

  <!-- Back to Home Link -->
  <a href="index.html" class="back-to-home-link">
    <i class="fa-solid fa-arrow-left"></i>
    <span>Back to Home</span>
  </a>

  <!-- Auth Card -->
  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-logo">
        <a href="index.html">
          <img src="assets/logo01.webp" alt="Stackly">
        </a>
      </div>
      <h2 class="auth-title font-serif">Welcome Back</h2>
      <p class="auth-subtitle">Login to manage your farm-fresh deliveries &amp; orders</p>
    </div>

    <!-- Role Switcher -->
    <div class="role-toggle-group">
      <button type="button" class="role-tab-btn active" data-role="customer">
        <i class="fa-solid fa-user"></i> Customer
      </button>
      <button type="button" class="role-tab-btn" data-role="admin">
        <i class="fa-solid fa-shield-halved"></i> Store Admin
      </button>
    </div>

    <!-- Login Form -->
    <form id="loginForm" novalidate>
      
      <!-- Email / User ID -->
      <div class="auth-input-group">
        <i class="fa-solid fa-envelope"></i>
        <input type="text" class="auth-input" id="loginEmail" placeholder="Email Address or User ID" required>
        <div class="auth-error-text" id="errLoginEmail" style="display: none;">Please enter a valid email address or user ID.</div>
      </div>

      <!-- Password -->
      <div class="auth-input-group password-group">
        <i class="fa-solid fa-lock input-left-icon"></i>
        <input type="password" class="auth-input" id="loginPassword" placeholder="Password" required>
        <button type="button" class="password-toggle-btn" aria-label="Toggle password visibility">
          <i class="fa-regular fa-eye"></i>
        </button>
        <div class="auth-error-text" id="errLoginPass" style="display: none;">Password must be at least 4 characters.</div>
      </div>

      <!-- Extra Controls -->
      <div class="auth-extra-row">
        <label class="auth-remember">
          <input type="checkbox" checked>
          <span>Remember me</span>
        </label>
        <a href="404.html" class="auth-forgot-link">Forgot Password?</a>
      </div>

      <!-- Submit -->
      <button type="submit" class="btn btn-primary auth-submit-btn">
        <i class="fa-solid fa-right-to-bracket"></i> Login to Account
      </button>

    </form>

    <!-- Footer Links -->
    <div class="auth-footer">
      Don't have an account? <a href="Signup.html">Create New Account</a>
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div id="toastContainer" class="toast-container"></div>

  <!-- Central JavaScript -->
  <script src="js/main.js?v=37"></script>
</body>
</html>
